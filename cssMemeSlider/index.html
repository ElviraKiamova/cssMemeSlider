<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meme-slider</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="slider">
    <input class="slider__radio" type="radio" name="slide" id="slide-1" checked>
    <input class="slider__radio" type="radio" name="slide" id="slide-2">
    <input class="slider__radio" type="radio" name="slide" id="slide-3">
    <input class="slider__radio" type="radio" name="slide" id="slide-4">
    <input class="slider__radio" type="radio" name="slide" id="slide-5">
    <input class="slider__radio" type="radio" name="slide" id="slide-6">

    <div class="slider__images">
      <figure class="slider__slide">
        <img class="slider__image" src="img/1.jpg" alt="Мем1">
      </figure>
      <figure class="slider__slide">
        <img class="slider__image" src="img/2.jpg" alt="Мем2">
      </figure>
      <figure class="slider__slide">
        <img class="slider__image" src="img/3.jpg" alt="Мем3">
      </figure>
      <figure class="slider__slide">
        <img class="slider__image" src="img/4.jpg" alt="Мем4">
      </figure>
      <figure class="slider__slide">
        <img class="slider__image" src="img/5.jpg" alt="Мем5">
      </figure>
      <figure class="slider__slide">
        <img class="slider__image" src="img/6.jpg" alt="Мем6">
      </figure>
    </div>

    <div class="slider__footer">
      <div class="slider__captions">
        <p class="slider__caption">When I talk to my daughter</p>
        <p class="slider__caption">We only dreamed of rest</p>
        <p class="slider__caption">Tell us about it....</p>
        <p class="slider__caption">This is me at school sberbank when I study languages With</p>
        <p class="slider__caption">I've seen this before, but not at my place of work&#41;&#41;&#41;</p>
        <p class="slider__caption">Life</p>
      </div>

      <nav class="slider__nav" aria-label="Навигация по слайдам">
        <label class="slider__dot-label" for="slide-1">
          <span class="slider__dot"></span>
        </label>
        <label class="slider__dot-label" for="slide-2">
          <span class="slider__dot"></span>
        </label>
        <label class="slider__dot-label" for="slide-3">
          <span class="slider__dot"></span>
        </label>
        <label class="slider__dot-label" for="slide-4">
          <span class="slider__dot"></span>
        </label>
        <label class="slider__dot-label" for="slide-5">
          <span class="slider__dot"></span>
        </label>
        <label class="slider__dot-label" for="slide-6">
          <span class="slider__dot"></span>
        </label>
      </nav>
    </div>
  </main>
</body>
</html>
